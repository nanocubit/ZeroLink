[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerolink"
version = "2.0.0"
description = "High-Performance Zero-Copy IPC Runtime for PyTorch with Enterprise-grade reliability"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ZeroLink Team", email = "hello@zerolink.com"}
]
keywords = [
    "pytorch", "cuda", "vmm", "ipc", "deep-learning",
    "zero-copy", "gpu-memory", "buddy-allocator", "high-performance", "zerolink"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "blake3>=0.4.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=1.12.0",
    "cuda-python>=11.7",
]
ray = [
    "ray>=2.0.0",
]
cgpu = [
    "cgpu>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "mypy",
]
full = [
    "torch>=1.12.0",
    "cuda-python>=11.7",
    "ray>=2.0.0",
    "cgpu>=0.1.0",
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/your-org/zerolink"
Documentation = "https://github.com/your-org/zerolink/docs"
Repository = "https://github.com/your-org/zerolink.git"
"Bug Tracker" = "https://github.com/your-org/zerolink/issues"

[tool.setuptools]
packages = ["zerolink"]
