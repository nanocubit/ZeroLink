[workspace]
resolver = "2"
members = ["crates/forge-core", "crates/forge-store", "crates/forge-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
forge-core = { path = "crates/forge-core" }
forge-store = { path = "crates/forge-store" }
